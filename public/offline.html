<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>अफलाइन · Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .offline-box {
      max-width: 480px;
      padding: 48px 32px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.08);
    }
    .offline-box .icon { font-size: 72px; margin-bottom: 16px; }
    .offline-box h1 {
      color: #123b6d;
      margin: 0 0 10px;
      font-size: 28px;
    }
    .offline-box p {
      color: #627083;
      font-size: 16px;
      line-height: 1.7;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 34px;
      background: #123b6d;
      color: #fff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: 0.15s;
    }
    .btn:hover { background: #0a2a4f; transform: scale(1.02); }
    .offline-box .sub-icon {
      font-size: 48px;
      margin-top: 10px;
      display: block;
    }
  </style>
    <link rel="stylesheet" href="dark-mode.css">
</head>
<body>
  <div class="offline-box">
    <div class="icon">📶</div>
    <h1>इन्टरनेट जडान छैन</h1>
    <p>कृपया आफ्नो इन्टरनेट जडान जाँच गर्नुहोस् र फेरि प्रयास गर्नुहोस्।</p>
    <p style="font-size:14px;color:#999;margin-top:4px;">You are offline. Please check your connection.</p>
    <span class="sub-icon">🪷</span>
    <a href="/" class="btn">🏠 पुनः प्रयास गर्नुहोस्</a>
  </div>
    <script src="dark-mode.js" defer></script>
</body>
</html>
